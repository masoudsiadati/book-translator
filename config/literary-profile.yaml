schema_version: '1.0'
profile_version: 1.0.0
book_id: the-fires-of-heaven-en-fa
prose_profile:
  - لحن یک رمان فانتزی حماسی را حفظ کن؛ نثر ادبی است اما متکلف نیست.
  - تفاوت روایت با گفت‌وگو و تفاوت سطح رسمیت شخصیت‌ها را نگه دار.
  - اصطلاحات جهان داستان تابع منبع اصطلاحات منجمد این اجرا هستند.
chapter_guidance:
  - chapter_id: '011'
    focus:
      - مالکیت گفت‌وگو و طبیعی بودن پاسخ‌ها را با دقت حفظ کن.
    negative_controls: []
  - chapter_id: '012'
    focus:
      - این فصل کنترل پاک است؛ از ویرایش غیرضروری پرهیز کن.
    negative_controls: []
  - chapter_id: '032'
    focus:
      - نثر را بدون جابه‌جایی مالکیت پاراگراف‌ها طبیعی کن.
    negative_controls: []
  - chapter_id: '040'
    focus:
      - در متن بلند و گفت‌وگومحور، لحن شخصیت‌ها و ریتم رفت‌وبرگشت گفت‌وگو را پیوسته نگه دار.
    negative_controls: []
  - chapter_id: '048'
    focus:
      - گذار مربوط به Samara را همان‌قدر ناگهانی نگه دار که در منبع است.
    negative_controls:
      - برای هموار کردن گذار Samara هیچ رابطه، توضیح یا عبارت پیوندی تازه‌ای اختراع نکن.
