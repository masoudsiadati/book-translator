# Book 6 configuration, selected with `--book lord-of-chaos`; the legacy config/book.yaml stays
# Book 5's. Shared translation resources are project files and are referenced unchanged.
book_id: "lord-of-chaos-en-fa"
title_en: "Lord of Chaos"
# Blank until a human decides the Persian title; the resolver never invents one.
title_fa: "ارباب آشوب"
author: "Robert Jordan"
# Series identity is a recorded decision, persisted here so every resolve reproduces it.
series_name: "The Wheel of Time"
series_index: 6
source_language: "en"
target_language: "fa"
pdf_path: "input/book6.pdf"
chunk_target_words: 1800
chunk_max_words: 2400
previous_context_words: 250
translation_prompt: "config/translation-prompt.md"
glossary: "config/glossary.yaml"
style_guide: "config/style-guide.md"
# Series-aware terminology: the book derives its own registry from the series policy and never
# reads the first book's config/terminology.yaml.
series_terminology_policy: "config/series/wheel-of-time/terminology-policy.yaml"
reference_corpus: "config/series/wheel-of-time/reference-corpus.yaml"
terminology_acceptance_policy: "manual"
terminology_confidence_threshold: 0.9
terminology_review_required: true
translation_provider_models:
  fake:
    - "fake-v1"
  openai:
    - "gpt-5"
    - "gpt-5.6-terra"
  codex-cli: []
  # Explicit allow-list: `opus` is the Claude Code alias the production worker requests; omitting
  # --model still keeps the authenticated session's own selection. An empty list is not a wildcard.
  claude-code:
    - "opus"
openai_reasoning_models: []
provider_timeout_seconds: 600
# Claude Code applies this as the per-request `max_tokens`, and thinking tokens share it. Both real
# Opus attempts on the 1,791-word prologue chunk produced about 16,200 output tokens, so 12000 was
# exhausted every time and Claude Code had to continue in a second turn. 32000 is the CLI's own
# default ceiling and leaves roughly 1.5x headroom for the largest 2,400-word chunks.
provider_max_output_tokens: 32000
provider_sdk_retry_count: 0
provider_store_raw_response: true
output_format: "epub3"
