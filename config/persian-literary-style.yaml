schema_version: '1.0'
contract_version: 1.0.0
target_language: fa
literary_naturalness:
  - نثر باید ادبی، روان و طبیعی باشد، بی‌آنکه به بازنویسی یا اقتباس تبدیل شود.
  - ریتم جمله و پیوند بندها را با امکانات طبیعی فارسی سامان بده.
dialogue_register:
  - گفت‌وگو باید طبیعی باشد، اما محاوره‌ای‌تر از لحن شخصیت و متن مبدأ نشود.
  - تفاوت لحن شخصیت‌ها، شیوهٔ خطاب و رسمی یا صمیمی بودن سخن حفظ شود.
punctuation:
  - نشانه‌گذاری معیار فارسی و فاصله‌گذاری درست را به کار ببر.
  - جای نشانه‌ها را با ساخت نحوی فارسی هماهنگ کن و از الگوی مکانیکی انگلیسی پرهیز کن.
quotation_style:
  - گفتار مستقیم را با گیومهٔ فارسی «...» بنویس، مگر آنکه ساختار ثبت‌شدهٔ متن خلاف آن را لازم کند.
  - مالکیت گفت‌وگو و مرز گفتار با روایت را تغییر نده.
orthography_and_zwnj:
  - املای معیار فارسی، «ی» و «ک» فارسی و نیم‌فاصلهٔ درست در پیشوندها و پسوندها را رعایت کن.
  - هیچ یکسان‌سازی املایی نباید نام یا اصطلاح قفل‌شده را تغییر دهد.
english_syntax:
  - ترتیب بندها و وابسته‌ها را در صورت نیاز به ساخت طبیعی فارسی تبدیل کن.
  - از گرته‌برداری نحوی، رابط‌های مکانیکی و تکرار ضمیرهای غیرضروری پرهیز کن.
narrator_consistency:
  - زمان، زاویهٔ دید، فاصلهٔ روایی و سطح رسمیت را در سراسر فصل یکدست نگه دار.
proper_names:
  - نام‌های خاص و هویت اشخاص و مکان‌ها را دقیقاً مطابق اصطلاحات قفل‌شده حفظ کن.
terminology_flexibility:
  - اصطلاحات exact و نام‌های قفل‌شده تغییرناپذیرند.
  - اصطلاحات morphological می‌توانند فقط صرف و پی‌بست طبیعی فارسی بگیرند.
  - اصطلاحات contextual و advisory را با توجه به بافت و روانی نثر به کار ببر، بی‌آنکه مفهوم عوض شود.
inner_monologue:
  - تک‌گویی درونی را از روایت و گفتار مستقیم قابل تشخیص نگه دار و سطح زبان شخصیت را حفظ کن.
emphasis:
  - تأکید و ایتالیک را فقط وقتی ساختار ورودی آن را پشتیبانی می‌کند حفظ کن؛ تأکید تازه نساز.
prohibitions:
  - ابهام عمدی، تکرار هدفمند، نفی، وجه، عدد، رابطهٔ علّی و ترتیب رخدادها را تغییر نده.
  - توضیح، رابط، احساس یا انگیزه‌ای که در متن نیست اضافه نکن.
  - نثر را خودسرانه امروزی، کوتاه، ساده یا کاملاً محاوره‌ای نکن.
  - محتوا را میان شناسه‌های پاراگراف جابه‌جا نکن.
