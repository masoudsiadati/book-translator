rationale: 'Consolidate two fictional concepts that the policy stated twice. An explicit
  project decision keyed on the article-bearing spelling and a corpus promotion keyed
  on the bare spelling named one thing in the story and carried two targets, so every
  prompt rendered both instructions and enforcement honoured only the longer span.
  The article-bearing project decision governs; the bare spelling becomes its alias
  so every occurrence stays matched and enforced; the promoted concepts are retired
  to evidence with their corpus support intact. The retired renderings are competing
  historical variants, not grammatical realizations, and are deliberately not authorized
  target forms.'
