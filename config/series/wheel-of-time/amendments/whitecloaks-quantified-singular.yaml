rationale: >-
  Persian takes the singular noun after a quantifier (چند، هر، چندین), so "some Whitecloaks" is
  correctly «چند فرزند نور». The singular Whitecloak canonical is authorized as a grammatical
  realization of the plural decision; the preferred plural target is unchanged.
